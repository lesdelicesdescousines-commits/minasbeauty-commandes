*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#faf9f7;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:1px solid #ece9e3;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#c4637a,#e8a0b0);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;margin-right:10px}
header h1{font-size:15px;font-weight:600}
header h1 span{color:#999;font-weight:400}
.badge-count{font-size:12px;background:#f7e8ee;color:#c4637a;padding:3px 10px;border-radius:20px;font-weight:500}
#import-screen{max-width:480px;margin:80px auto;padding:24px;text-align:center}
#import-screen h2{font-size:20px;font-weight:600;margin-bottom:8px}
#import-screen p{font-size:14px;color:#666;margin-bottom:28px;line-height:1.6}
.upload-zone{border:2px dashed #d8d4cc;border-radius:12px;padding:40px 24px;cursor:pointer;background:#fff;display:block}
.upload-zone:hover{border-color:#c4637a;background:#f7e8ee}
.upload-zone input{display:none}
.upload-zone .uz-icon{font-size:32px;margin-bottom:10px}
.upload-zone p{font-size:14px;color:#666;margin:0}
.upload-zone strong{color:#c4637a}
#app-screen{display:none}
.topbar{padding:12px 20px;background:#fff;border-bottom:1px solid #ece9e3;display:flex;gap:10px;align-items:center}
.search-box{flex:1;padding:9px 14px 9px 36px;border:1px solid #d8d4cc;border-radius:8px;font-size:14px;background:#faf9f7;color:#1a1a1a}
.search-box:focus{outline:none;border-color:#c4637a}
.search-wrap{flex:1;position:relative}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#999;font-size:14px;pointer-events:none}
.wilaya-sel{padding:9px 12px;border:1px solid #d8d4cc;border-radius:8px;font-size:13px;background:#faf9f7;cursor:pointer}
.reimport-btn{padding:9px 14px;background:#f7e8ee;border:1px solid #e8c8d8;border-radius:8px;font-size:13px;color:#c4637a;font-weight:500;cursor:pointer;white-space:nowrap}
.reimport-btn input{display:none}
.stats{display:flex;background:#fff;border-bottom:1px solid #ece9e3}
.stat{flex:1;padding:10px 16px;text-align:center;border-right:1px solid #ece9e3}
.stat:last-child{border-right:none}
.stat .v{font-size:20px;font-weight:700}
.stat .l{font-size:11px;color:#999;margin-top:2px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}
thead th{padding:9px 14px;text-align:left;font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.4px;background:#faf9f7;border-bottom:1px solid #ece9e3;white-space:nowrap}
tbody tr{border-bottom:1px solid #f0ede8;cursor:pointer}
tbody tr:hover{background:#fdf5f8}
td{padding:10px 14px;vertical-align:middle}
td.ref{font-weight:600;color:#c4637a;font-size:12px}
td.name{font-weight:500}
td.soft{color:#666;font-size:12px}
td.prod{color:#666;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.tag-active{background:#e8f5ee;color:#2a9d5c}
.tag-mod{background:#fff5e6;color:#e09a00}
.empty{text-align:center;padding:60px 20px;color:#999}
.empty .ei{font-size:36px;margin-bottom:10px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mhead{padding:18px 22px 14px;border-bottom:1px solid #ece9e3;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;border-radius:16px 16px 0 0}
.mhead h2{font-size:15px;font-weight:600}
.mref{font-size:12px;color:#c4637a;background:#f7e8ee;padding:3px 10px;border-radius:20px}
.xbtn{width:28px;height:28px;border:none;background:#f0ede8;border-radius:50%;font-size:15px;cursor:pointer;color:#666;display:flex;align-items:center;justify-content:center}
.xbtn:hover{background:#e0ddd8}
.mbody{padding:18px 22px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fgrp{margin-bottom:12px}
.fgrp label{display:block;font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.fgrp input,.fgrp textarea{width:100%;padding:9px 11px;border:1px solid #d8d4cc;border-radius:8px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#faf9f7}
.fgrp input:focus,.fgrp textarea:focus{outline:none;border-color:#c4637a;background:#fff}
.fgrp textarea{resize:vertical;min-height:70px}
.img-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0ede8}
.img-row:last-child{border-bottom:none}
.img-row img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#f5f4f0;border:1px solid #ece9e3;flex-shrink:0}
.img-row span{font-size:12px;color:#555;line-height:1.4}
.no-img{font-size:12px;color:#bbb;padding:8px 0;font-style:italic}
.mfoot{padding:14px 22px;border-top:1px solid #ece9e3;display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}
.btn-cancel{padding:8px 16px;border:1px solid #d8d4cc;border-radius:8px;background:#faf9f7;font-size:13px;cursor:pointer;color:#666}
.btn-save{padding:8px 18px;border:none;border-radius:8px;background:#c4637a;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-save:hover{background:#a04d62}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:600px){.frow{grid-template-columns:1fr}.stats{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>

<header>
  <div style="display:flex;align-items:center">
    <div class="logo">MB</div>
    <h1>Minasbeauty <span>— Commandes</span></h1>
  </div>
  <span class="badge-count" id="hcount">0 commandes</span>
</header>

<div id="import-screen">
  <div style="font-size:48px;margin-bottom:16px">🌸</div>
  <h2>Gestion des commandes</h2>
  <p>Importe ton fichier Google Sheets exporté en Excel (.xlsx) ou CSV</p>
  <label class="upload-zone" id="upload-label">
    <input type="file" id="file-main" accept=".xlsx,.xls,.csv">
    <div class="uz-icon">📂</div>
    <p><strong>Clique pour importer</strong><br>Excel (.xlsx) ou CSV</p>
  </label>
</div>

<div id="app-screen">
  <div class="topbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-box" id="search" type="text" placeholder="Rechercher par nom ou N° commande...">
    </div>
    <select class="wilaya-sel" id="wfilter"><option value="">Toutes les wilayas</option></select>
    <label class="reimport-btn">
      <input type="file" id="file-re" accept=".xlsx,.xls,.csv">↻ Changer
    </label>
  </div>
  <div class="stats">
    <div class="stat"><div class="v" id="s-total">0</div><div class="l">Commandes</div></div>
    <div class="stat"><div class="v" id="s-wilayas">0</div><div class="l">Wilayas</div></div>
    <div class="stat"><div class="v" id="s-mod">0</div><div class="l">Modifiées</div></div>
    <div class="stat"><div class="v" id="s-res">0</div><div class="l">Résultats</div></div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>N° Commande</th><th>Nom Prénom</th><th>Téléphone</th>
        <th>Wilaya</th><th>Produit</th><th>Prix</th><th>Statut</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none"><div class="ei">🔍</div><p>Aucune commande trouvée</p></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead">
      <h2>Détails commande</h2>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="mref" id="m-ref"></span>
        <button class="xbtn" id="xbtn">✕</button>
      </div>
    </div>
    <div class="mbody">
      <div class="frow">
        <div class="fgrp"><label>Nom Prénom</label><input id="m-nom" type="text"></div>
        <div class="fgrp"><label>Téléphone</label><input id="m-tel" type="text"></div>
      </div>
      <div class="frow">
        <div class="fgrp"><label>Wilaya</label><input id="m-wilaya" type="text"></div>
        <div class="fgrp"><label>Prix total</label><input id="m-prix" type="text"></div>
      </div>
      <div class="fgrp"><label>Adresse</label><input id="m-adresse" type="text"></div>
      <div class="fgrp"><label>Produit</label><textarea id="m-produit"></textarea></div>
      <div class="fgrp"><label>Images produits</label><div id="m-imgs"></div></div>
      <div class="fgrp"><label>Date</label><input id="m-date" type="text"></div>
    </div>
    <div class="mfoot">
      <button class="btn-cancel" id="xbtn2">Annuler</button>
      <button class="btn-save" id="savebtn">Enregistrer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

const IMGS = _N.map((n,i) => [n.toLowerCase(), _CDN + _F[i]]);

function normalize(s) {
  return s.toLowerCase()
    .replace(/[–—]/g, ' ')        // tirets longs
    .replace(/[^a-z0-9\s%+]/g, ' ') // garder lettres, chiffres, %, +
    .replace(/\s+/g, ' ')
    .trim();
}

function getImg(line) {
  const l = normalize(line
    .replace(/\s*\(\d+\)\s*$/,'')
    .replace(/-\s*\d+\s*(da|dz)?\s*$/i,'')
    .replace(/\s+\d+\s*$/,'')
  );
  let best = 0, bestUrl = null;
  for (const [k,u] of IMGS) {
    const kn = normalize(k);
    if (l.includes(kn) || kn.includes(l.substring(0,Math.min(l.length,25)))) return u;
    const words = kn.split(' ').filter(w=>w.length>3);
    if (!words.length) continue;
    const hits = words.filter(w=>l.includes(w));
    const score = hits.length/words.length;
    if (score>best && score>=0.5) { best=score; bestUrl=u; }
  }
  return bestUrl;
}

function fmtDate(v) {
  if (!v) return '';
  if (typeof v==='number' && v>40000 && v<60000) {
    const d = new Date((v-25569)*86400*1000);
    return d.toLocaleDateString('fr-DZ');
  }
  const s = String(v);
  const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3]+'/'+m[2]+'/'+m[1];
  return s.substring(0,16);
}

let orders=[], filtered=[], curId=null;

function readFile(file, cb) {
  if (file.name.toLowerCase().endsWith('.csv')) {
    const r = new FileReader();
    r.onload = e => {
      const text = e.target.result;
      const rows = text.split(/\r?\n/).map(line => {
        const cells=[]; let cur=''; let inQ=false;
        for (let i=0;i<line.length;i++) {
          const c=line[i];
          if (c==='"') { inQ=!inQ; }
          else if (c===',' && !inQ) { cells.push(cur.trim()); cur=''; }
          else { cur+=c; }
        }
        cells.push(cur.trim());
        return cells;
      }).filter(r=>r.some(c=>c!==''));
      cb(rows);
    };
    r.readAsText(file, 'UTF-8');
    return;
  }
  const r = new FileReader();
  r.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array',cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:''});
      cb(rows);
    } catch(err) { alert('Erreur: '+err.message); }
  };
  r.readAsArrayBuffer(file);
}

function parseRows(rows) {
  let hRow=0;
  for (let i=0;i<Math.min(6,rows.length);i++) {
    if (rows[i].filter(c=>c!=='').length>=4) { hRow=i; break; }
  }
  const h = rows[hRow].map(c=>String(c).toLowerCase().trim());
  const find = (keys) => { for (const k of keys) { const i=h.findIndex(c=>c.includes(k)); if (i>=0) return i; } return -1; };
  const iRef  = find(['référence','reference','n commande','n° commande','commande','ref']);
  const iNom  = find(['nom prenom','nom prénom','prenom','nom','client','name']);
  const iTel  = find(['numéro','numero','téléphone','telephone','tel','phone','mobile']);
  const iWil  = find(['wilaya','ville']);
  const iAdr  = find(['adresse','address']);
  const iProd = find(['produits','produit','product','article']);
  const iPrix = find(['prix produit','prix','price','total','montant']);
  const iDate = find(['date']);

  orders=[];
  for (let i=hRow+1;i<rows.length;i++) {
    const r=rows[i];
    if (!r || r.every(c=>c===''||c===null||c===undefined)) continue;
    orders.push({
      _i:i,
      ref:   iRef>=0  ? String(r[iRef]||'').trim()  : '',
      nom:   iNom>=0  ? String(r[iNom]||'').trim()  : '',
      tel:   iTel>=0  ? String(r[iTel]||'').trim()  : '',
      wilaya:iWil>=0  ? String(r[iWil]||'').trim()  : '',
      adresse:iAdr>=0 ? String(r[iAdr]||'').trim()  : '',
      produit:iProd>=0? String(r[iProd]||'').trim() : '',
      prix:  iPrix>=0 ? String(r[iPrix]||'').trim() : '',
      date:  iDate>=0 ? fmtDate(r[iDate])           : '',
      mod:false
    });
  }

  const sel = document.getElementById('wfilter');
  sel.innerHTML = '<option value="">Toutes les wilayas</option>';
  [...new Set(orders.map(o=>o.wilaya).filter(Boolean))].sort()
    .forEach(w=>{ const o=document.createElement('option'); o.value=o.textContent=w; sel.appendChild(o); });

  document.getElementById('s-total').textContent = orders.length;
  document.getElementById('hcount').textContent = orders.length+' commandes';
  document.getElementById('s-wilayas').textContent = new Set(orders.map(o=>o.wilaya).filter(Boolean)).size;
  filterOrders();
}

function filterOrders() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const w = document.getElementById('wfilter').value;
  filtered = orders.filter(o => {
    const refClean = o.ref.toLowerCase().replace(/[^0-9a-z]/g,'');
    const qClean = q.replace(/[^0-9a-z]/g,'');
    const mq = !q || o.nom.toLowerCase().includes(q) || o.ref.toLowerCase().includes(q) || (qClean && refClean.includes(qClean));
    const mw = !w || o.wilaya===w;
    return mq && mw;
  });
  document.getElementById('s-res').textContent = filtered.length;
  document.getElementById('s-mod').textContent = orders.filter(o=>o.mod).length;
  renderTable();
}

function renderTable() {
  const tb = document.getElementById('tbody');
  tb.innerHTML='';
  const em = document.getElementById('empty');
  if (!filtered.length) { em.style.display='block'; return; }
  em.style.display='none';
  filtered.forEach(o => {
    const tr = document.createElement('tr');
    const ps = o.produit.length>30 ? o.produit.substring(0,30)+'…' : o.produit;
    tr.innerHTML = `
      <td class="ref">${o.ref||'—'}</td>
      <td class="name">${o.nom||'—'}</td>
      <td class="soft">${o.tel||'—'}</td>
      <td class="soft">${o.wilaya||'—'}</td>
      <td class="prod" title="${o.produit}">${ps||'—'}</td>
      <td class="soft">${o.prix ? o.prix+' DA' : '—'}</td>
      <td><span class="tag ${o.mod?'tag-mod':'tag-active'}">${o.mod?'Modifiée':'Active'}</span></td>
    `;
    tr.onclick = () => openModal(o._i);
    tb.appendChild(tr);
  });
}

function openModal(id) {
  const o = orders.find(x=>x._i===id);
  if (!o) return;
  curId=id;
  document.getElementById('m-ref').textContent = o.ref||'—';
  document.getElementById('m-nom').value = o.nom;
  document.getElementById('m-tel').value = o.tel;
  document.getElementById('m-wilaya').value = o.wilaya;
  document.getElementById('m-adresse').value = o.adresse;
  document.getElementById('m-produit').value = o.produit;
  document.getElementById('m-prix').value = o.prix;
  document.getElementById('m-date').value = o.date;
  const ic = document.getElementById('m-imgs');
  ic.innerHTML='';
  const lines = o.produit.split(/\n|\r/).map(l=>l.replace(/\s*\(\d+\)\s*$/,'').replace(/-\s*\d+\s*(da|dz)?\s*$/i,'').replace(/\s+\d+\s*$/,'').trim()).filter(Boolean);
  let found=0;
  lines.forEach(line => {
    const img=getImg(line);
    if (img) {
      found++;
      const div=document.createElement('div');
      div.className='img-row';
      div.innerHTML=`<img src="${img}" onerror="this.style.display='none'"><span>${line}</span>`;
      ic.appendChild(div);
    }
  });
  if (!found) ic.innerHTML='<p class="no-img">Aucune image trouvée</p>';
  document.getElementById('overlay').classList.add('on');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('on');
  curId=null;
}

function saveModal() {
  const o=orders.find(x=>x._i===curId);
  if (!o) return;
  o.nom=document.getElementById('m-nom').value;
  o.tel=document.getElementById('m-tel').value;
  o.wilaya=document.getElementById('m-wilaya').value;
  o.adresse=document.getElementById('m-adresse').value;
  o.produit=document.getElementById('m-produit').value;
  o.prix=document.getElementById('m-prix').value;
  o.date=document.getElementById('m-date').value;
  o.mod=true;
  closeModal();
  document.getElementById('s-mod').textContent=orders.filter(x=>x.mod).length;
  filterOrders();
  const t=document.getElementById('toast');
  t.textContent='✓ Commande enregistrée';
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2500);
}

function loadFile(file) {
  readFile(file, rows => {
    document.getElementById('import-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    parseRows(rows);
  });
}

document.getElementById('file-main').addEventListener('change', function() {
  if (this.files[0]) loadFile(this.files[0]);
});
document.getElementById('file-re').addEventListener('change', function() {
  if (this.files[0]) loadFile(this.files[0]);
});
document.getElementById('search').addEventListener('input', filterOrders);
document.getElementById('wfilter').addEventListener('change', filterOrders);
document.getElementById('xbtn').addEventListener('click', closeModal);
document.getElementById('xbtn2').addEventListener('click', closeModal);
document.getElementById('savebtn').addEventListener('click', saveModal);
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target===this) closeModal();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
